<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} - Vibe Board</title>
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(22, 27, 46, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #ec4899;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --code-bg: rgba(0, 0, 0, 0.4);
      --badge-bg: rgba(99, 102, 241, 0.15);
      --badge-text: #818cf8;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem;
      min-height: 100vh;
      line-height: 1.5;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    .header {
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: var(--badge-bg);
      color: var(--badge-text);
      margin-bottom: 0.75rem;
    }
    h1 {
      font-size: 2.25rem;
      margin: 0 0 0.5rem 0;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle { color: var(--text-muted); font-size: 1.1rem; margin: 0; }
    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .tab-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.6rem 1.2rem;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s ease;
    }
    .tab-btn:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
    .tab-btn.active {
      color: #fff;
      background: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.25rem; margin-bottom: 1.5rem; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      backdrop-filter: blur(12px);
    }
    .card h3 { margin-top: 0; font-size: 1.15rem; color: #fff; display: flex; align-items: center; gap: 0.5rem; }
    .prompt-box {
      position: relative;
      background: var(--code-bg);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 1rem;
      margin-top: 1rem;
    }
    .copy-btn {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .copy-btn:hover { background: var(--primary); }
    pre {
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
      color: #e2e8f0;
      white-space: pre-wrap;
      word-break: break-word;
      padding-top: 1.5rem;
    }
    .checklist { list-style: none; padding: 0; margin: 0; }
    .checklist li {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.6rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }
    .checklist li input[type="checkbox"] {
      margin-top: 0.25rem;
      cursor: pointer;
      accent-color: var(--primary);
    }
    .checklist li.completed {
      text-decoration: line-through;
      color: var(--text-muted);
    }
    footer {
      margin-top: 3rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
      padding-top: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <span class="badge">⚡ Vibe Storm Ideation</span>
      <h1>{{TITLE}}</h1>
      <p class="subtitle">{{SUBTITLE}}</p>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab(this, 'biz')">💼 Business Canvas</button>
      <button class="tab-btn" onclick="switchTab(this, 'mkt')">📣 Marketing Matrix</button>
      <button class="tab-btn" onclick="switchTab(this, 'content')">🎬 Content Sprint</button>
      <button class="tab-btn" onclick="switchTab(this, 'sprint')">🚀 48h Go-To-Market Sprint</button>
    </div>

    <div id="biz" class="tab-content active">
      {{BIZ_CONTENT}}
    </div>

    <div id="mkt" class="tab-content">
      {{MKT_CONTENT}}
    </div>

    <div id="content" class="tab-content">
      {{CONTENT_CONTENT}}
    </div>

    <div id="sprint" class="tab-content">
      {{SPRINT_CONTENT}}
    </div>

    <footer>
      Generated with <a href="https://github.com/abm-dungtq/vibe-storm" style="color: var(--badge-text); text-decoration: none; font-weight: 600;">vibe-storm</a> • AI-Native Business & Commercial Ideation for Solopreneurs
    </footer>
  </div>

  <script>
    function switchTab(btn, id) {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
      if (btn) btn.classList.add("active");
      const target = document.getElementById(id);
      if (target) target.classList.add("active");
    }

    function copySnippet(btn) {
      const code = btn.parentElement.querySelector("pre").innerText;
      const onSuccess = () => {
        const originalText = btn.innerText;
        btn.innerText = "✓ Copied!";
        btn.style.background = "#10b981";
        setTimeout(() => {
          btn.innerText = originalText;
          btn.style.background = "";
        }, 1500);
      };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(code).then(onSuccess).catch(() => fallbackCopy(code, onSuccess));
      } else {
        fallbackCopy(code, onSuccess);
      }
    }

    function fallbackCopy(text, cb) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand("copy");
        if (cb) cb();
      } catch (err) {
        console.error("Copy failed", err);
      }
      document.body.removeChild(ta);
    }

    document.querySelectorAll(".checklist input[type='checkbox']").forEach(box => {
      box.addEventListener("change", (e) => {
        const li = e.target.closest("li");
        if (e.target.checked) {
          li.classList.add("completed");
        } else {
          li.classList.remove("completed");
        }
      });
    });
  </script>
</body>
</html>
